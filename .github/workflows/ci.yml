name: Machine Learning Workflow CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Workflow-CI/**'

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pandas scikit-learn mlflow matplotlib seaborn

    - name: Run MLflow Project (Re-training Model)
      run: |
        cd Workflow-CI/MLProject
        # Menjalankan proyek dan menyimpan log output ke file teks
        mlflow run . --env-manager local > run_output.txt
        cat run_output.txt
        
        # Mengambil ID Run terbaru yang sukses dibuat secara dinamis
        RUN_ID=$(grep -oE "run with ID '[a-f0-9]+'" run_output.txt | head -n 1 | cut -d"'" -f2)
        echo "LATEST_RUN_ID=$RUN_ID" >> $GITHUB_ENV
        echo "Berhasil mendapatkan Run ID terbaru: $RUN_ID"

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and Push MLflow Docker Image
      run: |
        # Menggunakan LATEST_RUN_ID secara dinamis agar tidak hardcoded/error
        mlflow models build-docker -m "runs:/${{ env.LATEST_RUN_ID }}/model" -n "${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-model:latest"
        
        # Mengunggah hasil build docker ke repositori Docker Hub Pitria
        docker push "${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-model:latest"