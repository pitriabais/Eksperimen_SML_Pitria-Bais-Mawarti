name: Machine Learning Workflow CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Workflow-CI/**'

jobs:
  train-and-build-docker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install pandas scikit-learn mlflow matplotlib seaborn

    - name: Run MLflow Project (Re-training Model)
      run: |
        cd Workflow-CI/MLProject
        mlflow run . --env-manager local

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Build and Push MLflow Docker Image
      run: |
        # Membangun docker image menggunakan perintah mlflow models build-docker
        mlflow models build-docker -m "runs:/e39f882ab68b44e9a525887f8d5cd687/baseline_model" -n "${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-model:latest" --enable-mlserver
        
        # Mengunggah hasil build docker ke repositori Docker Hub Pitria
        docker push "${{ secrets.DOCKER_HUB_USERNAME }}/heart-disease-model:latest"